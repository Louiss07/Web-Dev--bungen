{% extends "base.html" %}

{% block titel %}Trade{% endblock %}




{% block inhalt %}
<h1>{{ titel }}</h1>

<table>
    <thead>
        <tr>
            <th> Datum </th>
            <th> Ticker </th>
            <th> Setup</th>
            <th> Richtung </th>
            <th> PNL </th>
        </tr>
    </thead>
    <tbody>

        <tr>
            <td> {{trade.datum}} </td>
            <td> {{trade.ticker}} </td>
            <td> {{trade.setup}} </td>
            <td> {{trade.richtung}} </td>
            <td class="{% if trade.pnl > 0 %}gewinn{% else %}verlust{% endif %}"> {{"%.2f"|format(trade.pnl)}} </td>

        </tr>





    </tbody>
</table>

{% endblock %}
